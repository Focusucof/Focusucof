      <text x="0" y="431" xml:space="preserve">==-;;:::::·.                                                                   .·;-==+</text>
      <text x="0" y="445" xml:space="preserve">---;;:::;:·.    ...                                                      .···.··:;-=++</text>
      <text x="0" y="459" xml:space="preserve">---;;:::::·.    ...                                             .......··:;;;;;;--==++</text>
      <text x="0" y="473" xml:space="preserve">--;;;::···.........                                    .........·····::;;--=====+++++*</text>
      <text x="0" y="487" xml:space="preserve">;;;;:::·...........                                   .·:::····::::;;---=+++*****++++*</text>
      <text x="0" y="501" xml:space="preserve">;;;::::·....······..                                ..·:;;;;:::;;;--==++**xxx%%%x*+++*</text>
      <text x="0" y="515" xml:space="preserve">;;;::::···········..                               .··:;---;;;;--==++**xx%%%##%%x*+++*</text>
      <text x="0" y="529" xml:space="preserve">;;::::::::::······..                             ..··:;;----;--=++**xx%%%#####%%x**+**</text>
      <text x="0" y="543" xml:space="preserve">::::;;;;;;;:::····..                            ..··:;;;;--;;--=+*xx%######%%%%x**+++*</text>
  </g>
  <rect class="scan" x="0" y="0" width="1200" height="1" fill="#ede6d6" fill-opacity=".07"/>
  <text x="281" y="414" class="hx" style="animation-delay:0.0s">0x67C76FB008</text>
    <text x="912" y="379" class="hx" style="animation-delay:1.7s">0xBEBB2737F6</text>
    <text x="882" y="297" class="hx" style="animation-delay:3.4s">0x0FB23C6F5D</text>
    <text x="219" y="70" class="hx" style="animation-delay:5.1s">0x255404E4F</text>
    <text x="914" y="316" class="hx" style="animation-delay:6.8s">0x34D660</text>
    <text x="255" y="332" class="hx" style="animation-delay:8.5s">0xA8D41BE</text>

  <g text-anchor="middle">
    <text x="600" y="214" class="mono r r1" font-size="12" letter-spacing="4" fill="#6b6558">FOCUSUCOF</text>
    <text x="600" y="306" class="serif r r2" font-size="104" fill="#ede6d6" letter-spacing="-1">Devin Boodoo</text>
    <text x="600" y="364" class="mono r r3" font-size="14" letter-spacing="1" fill="#9a9489">software <tspan fill="#4a4740">·</tspan> systems <tspan fill="#4a4740">·</tspan> security</text>
  </g>

  <g class="r r5">
    <g class="hzc">
      <ellipse cx="600" cy="470" rx="420" ry="10" fill="#ede6d6" fill-opacity=".10" filter="url(#soft)"/>
      <rect x="250" y="469.5" width="700" height="1" fill="url(#hz)"/>
    </g>
  </g>

  <rect width="1200" height="540" fill="url(#vig)"/>
  <rect width="1200" height="540" filter="url(#g)" opacity=".07"/>
</svg>
